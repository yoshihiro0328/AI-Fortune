name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Docker isolated HTTP and database integration
        run: npm run test:integration
        env:
          PHASE6_REPORT_PATH: phase6-integration-results.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: phase6-integration-results
          path: phase6-integration-results.json
