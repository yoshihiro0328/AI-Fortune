name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      RUN_CONSULTATION_LIVE: "0"
      RUN_SUBSCRIPTION_LIVE: "0"
      RUN_FOLLOWUP_LIVE: "false"
      RUN_EDITORIAL_LIVE: "false"
      RUN_EDITORIAL_BACKFILL: "false"
      DYNAMIC_DIAGNOSTIC: ""
      PLUS_CONNECTED_BROWSER: "0"
      PLUS_CONNECTED_TTY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Public snapshot secret-pattern check (values suppressed)
        run: node scripts/security/check-public-content.mjs HEAD
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Local review fixtures (synthetic only; no server or external requests)
        run: node --test scripts/local-review/fixtures.test.mjs
      - name: AI evaluation full isolated path (synthetic only)
        run: npx vitest run --config scripts/phase6/ai-evaluation/evaluation.config.ts
      - name: Portable payment script regressions (synthetic only; no Mac browser or OS sandbox)
        run: npm run test:payment-scripts
      - name: Portable Plus connected scenario, restoration and provider HTTP (synthetic only; no Mac browser or OS sandbox)
        run: npm run test:subscription-scripts
      - name: Install Chromium for synthetic local key form regression
        run: npx playwright install --with-deps chromium
      - name: Native browser key form (synthetic only; no attached user browser)
        run: npm run test:subscription-key-form
      - name: Saved synthetic report message display and copy
        run: node scripts/phase6/ai-evaluation/message-browser.mjs
      - name: Offline local recipient form checks
        run: python3 scripts/phase6/auth-recipient-input-test.py
      - run: npm run build
      - name: Prepare identical PostgreSQL image from official Docker Hub source
        env:
          POSTGRES_SOURCE: docker.io/supabase/postgres@sha256:e85bc10ac5b141223b289e1e8dc8d448cf3df92501917149db0366b9c5aaf053
        run: |
          docker pull --platform linux/amd64 "$POSTGRES_SOURCE"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$POSTGRES_SOURCE")" = linux/amd64
          docker tag "$POSTGRES_SOURCE" public.ecr.aws/supabase/postgres:17.11.0.004
      - name: Shared production budget concurrent connections (network isolated)
        run: node scripts/production/budget-concurrency.mjs
      - name: Frozen complete STEP10 SQL in isolated PostgreSQL
        run: python3 scripts/phase6/step10-complete-sql-verify.py --synthetic-ci --report phase6-complete-sql-results.json
      - name: Offline scoped Stripe catalog initialization
        run: python3 scripts/phase6/stripe-init-verify.py
        env:
          PHASE6_STRIPE_INIT_REPORT: phase6-stripe-init-results.json
      - name: Docker isolated HTTP and database integration
        run: npm run test:integration
        env:
          PHASE6_REPORT_PATH: phase6-integration-results.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: phase6-integration-results
          path: |
            phase6-integration-results.json
            phase6-stripe-init-results.json
            phase6-complete-sql-results.json
